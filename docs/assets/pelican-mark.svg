  <title id="pe-Dr-title">Pelican Engine</title>
  <desc id="pe-Dr-desc">A refinement of the original D bold sculpture emblem. The original fierce eye, long bill, crest and gold accents are retained. A closed black eye mask frames the eye, while the continuous white neck broadens into a fuller upper chest. Transparent background.</desc>

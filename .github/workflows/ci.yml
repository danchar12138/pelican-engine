name: Engine CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Node 24
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run build
      - run: npm run distribution:pack
      - name: Typecheck and regressions (Linux display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run verify
      - name: Typecheck and regressions
        if: runner.os != 'Linux'
        run: npm run verify
      - name: Independent npm installation and browser deployment (Linux display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run distribution:smoke -- --online-install
      - name: Independent npm installation and browser deployment
        if: runner.os != 'Linux'
        run: npm run distribution:smoke -- --online-install
      - name: Preserve the tested npm tarball
        uses: actions/upload-artifact@v4
        with:
          name: npm-package-${{ runner.os }}
          path: .pelican/npm/artifacts/*.tgz
          if-no-files-found: error
          retention-days: 14

name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run distribution:pack
      - name: Publish using the npm Automation Token
        shell: pwsh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          $version = (Get-Content .pelican/npm/package/package.json -Raw | ConvertFrom-Json).version
          $distTag = if ($version.Contains('-')) { 'next' } else { 'latest' }
          npm publish "./.pelican/npm/artifacts/pelican-engine-$version.tgz" --access public --tag $distTag

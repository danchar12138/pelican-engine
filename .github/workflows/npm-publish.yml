name: Publish npm package

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Remove the obsolete next dist-tag
        required: true
        type: choice
        options:
          - remove-next

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-main
  queue: max

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm run distribution:pack
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.21.2
      - name: Publish to latest using OIDC
        shell: pwsh
        run: |
          $version = (Get-Content .pelican/npm/package/package.json -Raw | ConvertFrom-Json).version
          npm publish (Join-Path .pelican/npm/artifacts ('pelican-engine-' + $version + '.tgz')) --access public --tag latest
  remove-next:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'remove-next'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.21.2
      - name: Remove obsolete next tag using OIDC
        run: npm dist-tag rm pelican-engine next

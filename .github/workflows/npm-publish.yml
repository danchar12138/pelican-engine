name: Publish npm package

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-main
  queue: max

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: npm-package-Linux
          path: .pelican/npm/artifacts
      - run: npm install --global npm@11.21.2
      - name: npm publish exact tarball using OIDC (--tag latest)
        run: npm run release:publish
      - run: npm run distribution:verify-registry

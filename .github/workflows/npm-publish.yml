name: Publish npm package

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-main
  queue: max

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run distribution:pack
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.21.2
      - name: Publish to latest using OIDC
        shell: pwsh
        run: |
          $version = (Get-Content .pelican/npm/package/package.json -Raw | ConvertFrom-Json).version
          $metadata = npm view ('pelican-engine@' + $version) version --json --silent 2>&1
          if ($LASTEXITCODE -eq 0) {
            throw ('TC_NPM_VERSION_PUBLISHED: pelican-engine@' + $version + ' already exists. Increment the repository version in the next release batch; published versions cannot be overwritten.')
          }
          if (-not ($metadata -match 'E404|404 Not Found|No match found')) {
            throw ('Unable to determine whether pelican-engine@' + $version + ' is published: ' + ($metadata -join ' '))
          }
          npm publish (Join-Path .pelican/npm/artifacts ('pelican-engine-' + $version + '.tgz')) --access public --tag latest
